<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="魔女GEO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A3D75"/>
      <stop offset="100%" stop-color="#7A5A96"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C879"/>
      <stop offset="100%" stop-color="#B8892B"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" rx="192" fill="url(#bg)"/>

  <!-- 外圈轨道 -->
  <circle cx="512" cy="500" r="268" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10"/>

  <!-- 六层漏斗弧（六段，代表 AI 六层漏斗） -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="26" stroke-linecap="round">
    <path d="M 512 232 A 268 268 0 0 1 680 268"/>
    <path d="M 680 300 A 268 268 0 0 1 744 432"/>
    <path d="M 744 464 A 268 268 0 0 1 680 596"/>
    <path d="M 680 628 A 268 268 0 0 1 512 732"/>
    <path d="M 512 732 A 268 268 0 0 1 344 628"/>
    <path d="M 344 596 A 268 268 0 0 1 280 464"/>
  </g>
  <!-- 进度高亮弧（完成约 2/6） -->
  <g fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round">
    <path d="M 512 232 A 268 268 0 0 1 680 268"/>
    <path d="M 680 300 A 268 268 0 0 1 744 432"/>
  </g>

  <!-- 中心水晶球 -->
  <circle cx="512" cy="500" r="176" fill="#FFFFFF" fill-opacity="0.10"/>
  <circle cx="512" cy="500" r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="6"/>

  <!-- 尖顶女巫帽（简笔剪影） -->
  <g fill="#FFFFFF" fill-opacity="0.95">
    <path d="M512 366 c-10 0 -18 8 -18 18 l0 30 -70 92 c-10 13 -2 32 15 32 l146 0 c17 0 25 -19 15 -32 l-70 -92 0 -30 c0 -10 -8 -18 -18 -18 z"/>
    <ellipse cx="512" cy="546" rx="118" ry="20"/>
  </g>
  <!-- 帽带 -->
  <rect x="440" y="498" width="144" height="18" rx="9" fill="#A04030"/>

  <!-- 帽尖星 -->
  <g fill="url(#gold)">
    <path d="M512 300 l13 32 34 4 -25 23 7 34 -29 -17 -29 17 7 -34 -25 -23 34 -4 z"/>
  </g>

  <!-- 底部文字 GEO -->
  <text x="512" y="792"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112" font-weight="bold"
        letter-spacing="18" text-anchor="middle"
        fill="#FFFFFF">GEO</text>
  <text x="512" y="848"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="40" letter-spacing="10" text-anchor="middle"
        fill="#FFFFFF" fill-opacity="0.72">魔女 GEO · 实操落地</text>

  <!-- 六层刻度点 -->
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="512" cy="232" r="11"/>
    <circle cx="744" cy="432" r="11"/>
    <circle cx="680" cy="628" r="11"/>
    <circle cx="512" cy="732" r="11"/>
    <circle cx="344" cy="628" r="11"/>
    <circle cx="280" cy="432" r="11"/>
  </g>
</svg>
