<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔女GEO · GEO 实操落地课程</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ 头部 + 总进度 ============ -->
<header class="hero">
  <div class="hero-in">
    <div class="hero-top">
      <div class="brand">
        <div class="brand-mark">🔮</div>
        <div>
          <h1>魔女GEO · GEO 实操落地课程</h1>
          <div class="sub">AI 六层漏斗 · 26 关 · 不重不漏 · 学完能上手</div>
        </div>
      </div>
      <div class="hero-tag" id="heroTag">进度存于本机浏览器</div>
    </div>

    <p class="hero-claim">
      GEO 不是「做内容让 AI 看见」，是<em>让 AI 敢引用你</em>。<br>
      SEO 争排名和点击，GEO 争的是——在 AI 生成的那段答案里，你排第几、被怎么描述、附不附你的链接。
    </p>

    <div class="prog-block">
      <div class="prog-head">
        <span id="progLabel">总进度</span>
        <span class="pct"><span id="progPct">0</span>%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-meta">
        <span>已完成 <b id="mDone">0</b> / <b id="mTotal">26</b> 关</span>
        <span>徽章 <b id="mBadge">0</b> / 14</span>
        <span>段位 <b id="mLevel">见习 GEOer</b></span>
        <span id="mCert">证书未解锁</span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ============ 段位条 ============ -->
  <div class="level-strip">
    <div class="level-badge"><span class="lv">LV</span><span class="num" id="lvNum">1</span></div>
    <div class="level-info">
      <div class="nm" id="lvName">见习 GEOer</div>
      <div class="ds" id="lvDesc">刚摸到 AI 搜索的门把手</div>
      <div class="level-mini"><i id="lvBar"></i></div>
    </div>
    <div class="level-next" id="lvNext"></div>
  </div>

  <!-- ============ 导航 ============ -->
  <nav class="tabs" id="tabs"></nav>

  <!-- ============ 主体 ============ -->
  <main id="main"></main>

  <!-- ============ 底部工具条 ============ -->
  <div class="toolbar">
    <button class="btn sm" onclick="APP.exportData()">导出进度</button>
    <button class="btn sm" onclick="APP.importData()">导入进度</button>
    <button class="btn sm ghost" onclick="APP.resetAll()">重置</button>
    <span class="sp"></span>
    <span class="tip">数据仅存本机 localStorage，不上传 · 换机请先导出</span>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
